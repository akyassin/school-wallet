<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Wallet body -->
  <rect x="10" y="28" width="44" height="24" rx="5" fill="white"/>

  <!-- Wallet top fold -->
  <path d="M15 28 L15 23 Q15 18 21 18 L46 18 Q51 18 51 23 L51 28" fill="white" opacity="0.35"/>

  <!-- Card pocket (right side) -->
  <rect x="35" y="33" width="14" height="13" rx="4" fill="#dbeafe"/>
  <circle cx="42" cy="39.5" r="3.5" stroke="#2563eb" stroke-width="1.8" fill="none"/>
  <line x1="42" y1="37" x2="42" y2="42" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="39.5" y1="39.5" x2="44.5" y2="39.5" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Card lines (left side) -->
  <rect x="13" y="34" width="17" height="2.5" rx="1.25" fill="#bfdbfe"/>
  <rect x="13" y="40" width="12" height="2.5" rx="1.25" fill="#bfdbfe"/>

  <!-- Graduation cap -->
  <polygon points="32,6 44,11 32,16 20,11" fill="white" opacity="0.95"/>
  <rect x="31" y="11" width="2" height="5" rx="1" fill="white" opacity="0.9"/>
  <path d="M25 14 L25 18 Q25 22 32 22 Q39 22 39 18 L39 14"
        stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
